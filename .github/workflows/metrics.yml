name: Update development metrics

on:
  schedule:
    # Every day at 00:00 Asia/Shanghai.
    - cron: '0 16 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/metrics.yml'

permissions:
  contents: write

concurrency:
  group: development-metrics
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        id: config
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -n "$WAKATIME_API_KEY" ] && [ -n "$GH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Statistics were not generated. Add WAKATIME_API_KEY and GH_TOKEN in repository Actions secrets, then run this workflow manually." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Missing statistics secrets; metrics update skipped."
          fi

      - name: Update README statistics
        if: steps.config.outputs.ready == 'true'
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_OS: 'False'
          SHOW_PROJECTS: 'False'
          SHOW_EDITORS: 'False'
          SHOW_LANGUAGE: 'False'
          SHOW_TOTAL_CODE_TIME: 'False'
          SHOW_DAYS_OF_WEEK: 'False'
          SHOW_SHORT_INFO: 'False'
          SHOW_LOC_CHART: 'False'
          SHOW_LANGUAGE_PER_REPO: 'False'
          SHOW_COMMIT: 'True'
          SHOW_TIMEZONE: 'True'
          SHOW_PROFILE_VIEWS: 'True'
          SHOW_AI_CODING: 'True'
          SHOW_UPDATED_DATE: 'True'
